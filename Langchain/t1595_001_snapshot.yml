              - heading "Other sub-techniques of Active Scanning (3)" [level=5] [ref=f3e70] [cursor=pointer]
              - generic [ref=f3e71]:
                - paragraph [ref=f3e72]: Adversaries may scan victim IP blocks to gather information that can be used during targeting. Public IP addresses may be allocated to organizations by block, or a range of sequential addresses.
                - paragraph [ref=f3e73]:
                  - text: Adversaries may scan IP blocks in order to
                  - link "Gather Victim Network Information" [ref=f3e74] [cursor=pointer]:
                    - /url: /techniques/T1590
                  - text: ", such as which IP addresses are actively in use as well as more detailed information about hosts assigned these addresses. Scans may range from simple pings (ICMP requests and responses) to more nuanced scans that may reveal host software/versions via server banners or other network artifacts."
                  - generic "Dainotti, A. et al. (2012). Analysis of a" [ref=f3e75]:
