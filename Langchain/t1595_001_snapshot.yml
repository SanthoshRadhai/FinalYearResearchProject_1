                  - link "Search Open Websites/Domains" [ref=f3e78] [cursor=pointer]:
                    - /url: /techniques/T1593
                  - text: or
                  - link "Search Open Technical Databases" [ref=f3e79] [cursor=pointer]:
                    - /url: /techniques/T1596
                  - text: "), establishing operational resources (ex:"
                  - link "Develop Capabilities" [ref=f3e80] [cursor=pointer]:
